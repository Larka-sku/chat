# Simple workflow for deploying static content to GitHub Pages# 将静态内容部署到 GitHub Pages 的简单工作流
name: Deploy static content to Pages名称: 将静态内容部署到 Pages

on:
  # Runs on pushes targeting the default branch# 仅在推送到默认分支时运行# 仅在推送到默认分支时运行
  push:推送:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab# 允许您从“操作”选项卡手动运行此工作流
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:权限:
  contents: read内容: 读取
  pages: write页面: 写入
  id-token: write身份令牌: 写入

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.# 仅允许一次并发部署，跳过正在进行的部署与最新排队任务之间的其他排队任务。# 仅允许一次并发部署，跳过正在进行的部署与最新排队任务之间的其他排队任务。
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.# 但是，不要取消正在进行的部署，因为我们希望这些生产环境部署能够完成。# 但是，不要取消正在进行的部署，因为我们希望这些生产环境部署能够完成。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
